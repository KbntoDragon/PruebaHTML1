<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="Stylesheet" href="../Estilos/StylesLogin.css">
</head>
<body>
    <header></header>
    <main>
        <div class="container" style="max-width: 400px; margin-top: 3rem;">
            <div class="box">
            <h1 class="title is-4 has-text-centered">Crear Cuenta</h1>
            <form id="form-crear">
                <div class="field">
                    <label class="label">Usuario</label>
                    <div class="control">
                        <input class="input" type="text" id="usuario" placeholder="Ingresa tu usuario">
                    </div>
                </div>
                <div class="field">
                    <label class="label">Correo Electronico</label>
                    <div class="control">
                        <input class="input" type="email" id="correo" placeholder="Ingresa tu correo electronico">
                    </div>
                </div>
                <div class="field">
                    <label class="label">Contraseña</label>
                    <div class="control">
                        <input class="input" type="password" id="clave" placeholder="Ingresa tu contraseña">
                    </div>
                </div>
                <!-- aqui estan los botonsitos -->
                <div class="field">
                <div class="control">
                    <button type="submit" class="button is-primary is-fullwidth">Crear Cuenta</button>
                </div>
                </div>
            </form>
            </div>
        </div>
    </main>
    <footer id="footer-placeholder"></footer>
</body>
</html>
<script src="../Scripts/scriptLogin.js"></script>
